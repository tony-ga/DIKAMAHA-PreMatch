name: dikamaha-phase-6-8-test-closure

on:
  workflow_dispatch:
  push:
    paths:
      - pytest.ini
      - tests/**
      - src/**
      - scripts/**
      - Dockerfile
      - requirements.docker.txt
      - .github/workflows/phase-6-8-test-closure.yml

jobs:
  test-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.docker.txt pytest httpx
      - name: Publish local suite summary
        run: python scripts/run_phase_6_8_test_closure.py
      - name: Execute Docker E2E gate
        env:
          DIKAMAHA_IMAGE: dikamaha-local:phase-6-6-ci
        run: python scripts/run_ci_e2e.py
      - name: Assert closure and E2E status
        run: |
          python - <<'PY'
          import json
          closure = json.load(open("artifacts/phase_6_8_test_suite_closure/ci_test_summary.json"))
          e2e = json.load(open("artifacts/phase_6_6_ci_e2e/ci_result.json"))
          assert closure["decision"] == "test_suite_approved", closure
          assert e2e["status"] == "ci_e2e_approved", e2e
          PY
      - name: Upload test and E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dikamaha-phase-6-8-test-closure
          path: |
            artifacts/phase_6_8_test_suite_closure/
            artifacts/phase_6_6_ci_e2e/
