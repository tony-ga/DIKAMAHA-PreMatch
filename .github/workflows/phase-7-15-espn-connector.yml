name: dikamaha-phase-7-15-espn-connector

on:
  workflow_dispatch:
  push:
    paths:
      - src/espn_prospective_connector.py
      - scripts/run_phase_7_15_espn_connector.py
      - tests/test_phase_7_15_espn_connector.py
      - .github/workflows/phase-7-15-espn-connector.yml

jobs:
  connector-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile src/espn_prospective_connector.py scripts/run_phase_7_15_espn_connector.py
      - run: python -m pytest -q tests/test_phase_7_15_espn_connector.py
      - run: python scripts/run_phase_7_15_espn_connector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dikamaha-phase-7-15-espn-connector
          path: artifacts/phase_7_15_espn_connector/
