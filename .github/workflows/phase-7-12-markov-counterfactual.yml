name: dikamaha-phase-7-12-markov-counterfactual

on:
  workflow_dispatch:
  push:
    paths:
      - src/markov_counterfactual.py
      - scripts/run_phase_7_12_markov_counterfactual.py
      - tests/test_markov_counterfactual.py
      - .github/workflows/phase-7-12-markov-counterfactual.yml

jobs:
  counterfactual-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DIKAMAHA_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements.staging.txt pytest
      - name: Compile and unit tests
        run: |
          python -m py_compile src/markov_counterfactual.py scripts/run_phase_7_12_markov_counterfactual.py
          python -m pytest -q tests/test_markov_counterfactual.py tests/test_markov_v1.py tests/test_dikamaha_inference.py
      - name: Execute read-only historical evaluation
        if: env.DATABASE_URL != ''
        run: python scripts/run_phase_7_12_markov_counterfactual.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dikamaha-phase-7-12-markov-counterfactual
          path: artifacts/phase_7_12_markov_counterfactual/
          if-no-files-found: warn
