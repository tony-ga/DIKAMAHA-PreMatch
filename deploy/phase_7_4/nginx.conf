worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format dikamaha_json escape=json
        '{"timestamp":"$time_iso8601","request_id":"$request_id_header",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes_sent":$bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout dikamaha_json;

    map $http_x_request_id $request_id_header {
        default $http_x_request_id;
        "" $request_id;
    }

    map $http_origin $cors_allowed {
        default 0;
        "" 1;
        "https://staging.local" 1;
    }

    map $http_origin $cors_origin {
        default "";
        "https://staging.local" $http_origin;
    }

    map $http_transfer_encoding $chunked_request {
        default 0;
        ~*chunked 1;
    }

    limit_req_zone $binary_remote_addr zone=dikamaha_rate:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=dikamaha_connections:10m;

    upstream dikamaha_backend {
        server dikamaha-backend:8000;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 10m;

        client_max_body_size 64k;
        client_body_buffer_size 64k;
        client_body_timeout 5s;
        send_timeout 10s;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Request-ID $request_id_header always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;

        error_page 403 = @forbidden;
        error_page 411 = @length_required;
        error_page 413 = @body_too_large;
        error_page 429 = @rate_limited;
        error_page 500 502 503 504 = @upstream_failure;

        location = /openapi.json {
            return 404;
        }

        location = /docs {
            return 404;
        }

        location = /redoc {
            return 404;
        }

        location ~ ^/v1/(health|readiness)$ {
            proxy_pass http://dikamaha_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Request-ID $request_id_header;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        location / {
            if ($cors_allowed = 0) {
                return 403;
            }
            if ($chunked_request = 1) {
                return 411;
            }

            limit_req zone=dikamaha_rate burst=100 nodelay;
            limit_req_status 429;
            limit_conn dikamaha_connections 32;
            limit_conn_status 503;

            proxy_request_buffering on;
            proxy_buffering on;
            proxy_pass http://dikamaha_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Request-ID $request_id_header;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header X-Request-ID;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Vary;
            proxy_connect_timeout 2s;
            proxy_read_timeout 12s;
            proxy_send_timeout 12s;
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"detail":{"code":"origin_not_allowed","message":"Origin rechazado por el proxy local."}}';
        }

        location @length_required {
            default_type application/json;
            return 411 '{"detail":{"code":"chunked_request_rejected","message":"Transfer-Encoding chunked no permitido."}}';
        }

        location @body_too_large {
            default_type application/json;
            return 413 '{"detail":{"code":"request_too_large","message":"Request superior al limite del proxy."}}';
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"detail":{"code":"proxy_rate_limit_exceeded","message":"Rate limit del proxy excedido."}}';
        }

        location @upstream_failure {
            default_type application/json;
            return 503 '{"detail":{"code":"proxy_upstream_unavailable","message":"Backend no disponible temporalmente."}}';
        }
    }
}
