[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --capture=no -ra
markers =
    unit: pruebas aisladas con datos sintéticos.
    contract: pruebas del contrato y servicio local.
    historical: pruebas contra artefactos históricos congelados, sin PostgreSQL.
    postgres: integración histórica de solo lectura que exige DATABASE_URL y --run-postgres.
    docker: gate E2E que requiere un daemon Docker.
